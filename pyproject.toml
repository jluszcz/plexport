[project]
name = "plexport"
version = "0.1.0"
description = "Export statistics from your Plex library"
requires-python = ">=3.11"
dependencies = [
    "plexapi>=4.18.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
