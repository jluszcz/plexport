repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: end-of-file-fixer
      - id: file-contents-sorter
        files: .gitignore
      - id: trailing-whitespace
  - repo: local
    hooks:
      # Dependabot only edits pyproject.toml, so the header is generated from it.
      - id: sync-script-header
        name: sync plexport's PEP 723 header from pyproject.toml
        entry: uv run python scripts/sync_script_header.py
        language: system
        files: ^(pyproject\.toml|plexport)$
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # types_or/files overrides: the extensionless plexport script isn't
      # detected as python, so match it (and .py files) by name instead.
      - id: ruff-check
        args:
          - --fix
        types_or: [file]
        files: ^(.*\.py|plexport)$
      - id: ruff-format
        types_or: [file]
        files: ^(.*\.py|plexport)$
