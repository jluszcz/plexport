repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: end-of-file-fixer
      - id: file-contents-sorter
        files: .gitignore
      - id: trailing-whitespace
  # No sync-script-header hook here on purpose. CI runs `pre-commit run
  # --all-files`, so any hook touching the PEP 723 header becomes a required
  # check — and on a Dependabot PR the header is *expected* to be stale until
  # the post-merge sync runs. Such a hook fails every Dependabot PR by design.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # types_or/files overrides: the extensionless plexport script isn't
      # detected as python, so match it (and .py files) by name instead.
      - id: ruff-check
        args:
          - --fix
        types_or: [file]
        files: ^(.*\.py|plexport)$
      - id: ruff-format
        types_or: [file]
        files: ^(.*\.py|plexport)$
